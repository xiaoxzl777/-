<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>清新文旅风 精修版 · 悠行</title>
<style>
/* =========================================================
   设计读法：城市文旅规划应用的游客端，面向游客与答辩老师；
   清新、明亮、可信；基于 Ant Design 主题可落地。
   参数：DESIGN_VARIANCE 6 / MOTION_INTENSITY 4 / VISUAL_DENSITY 4
   ========================================================= */
*{box-sizing:border-box}
html,body{margin:0}
body{background:#D9DFDD;color:#10201C;font-family:"HarmonyOS Sans SC","MiSans","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
img,svg{display:block}
button{font:inherit;color:inherit}

/* ---------- 预览外壳（不属于设计稿） ---------- */
.chrome{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 20px;background:#0E1715;color:#DCE5E2}
.chrome-title b{display:block;font-size:15px;color:#F4F8F7}
.chrome-title span{font-size:12px;color:#8FA19C}
.chrome-gap{flex:1}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:#1C2926}
.seg button{border:0;background:transparent;color:#B9C7C3;font-size:13px;padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button:hover{color:#F4F8F7}
.seg button[aria-pressed="true"]{background:#F4F8F7;color:#0E1715;font-weight:600}
.seg button:focus-visible{outline:2px solid #5DD0B6;outline-offset:1px}
.stage{padding:18px 20px 28px}
.frame{container-type:inline-size;max-width:1440px;margin:0 auto;border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(8,30,25,.22)}
.frame.is-mobile{max-width:410px;border:10px solid #0E1715;border-radius:38px}
.note{max-width:1440px;margin:0 auto;padding:0 20px 28px;font-size:12px;line-height:1.8;color:#5E6D69}

/* ---------- 设计令牌 ---------- */
.yx{
  --bg:#F3F6F5; --surface:#FBFCFC; --surface-2:#EDF2F0; --surface-3:#E3EAE7;
  --line:#D9E2DF; --line-strong:#C5D1CD;
  --text:#14201D; --text-2:#45534F; --text-3:#5E6D69;
  --accent:#0B7F6B; --accent-hover:#096C5B; --accent-soft:#E0F0EB; --accent-ink:#086354; --on-accent:#F7FBFA;
  --warn:#9A6310; --warn-soft:#FBF1DE;
  --shadow:0 1px 2px rgba(16,40,35,.05),0 8px 24px rgba(16,40,35,.06);
  --shadow-lift:0 2px 6px rgba(16,40,35,.06),0 18px 40px rgba(16,40,35,.11);
  --focus:0 0 0 3px rgba(11,127,107,.28);
  --map-land:#EDF1EE; --map-park:#D8E9DC; --map-water:#BCDCE2; --map-water-ink:#4F8792; --map-block:#E4E9E6;
  --map-road:#FFFFFF; --map-road-case:#DCE2DF; --map-label:#5E6D69; --map-case:#FFFFFF;
  --il-sky-1:#CDEBE6; --il-sky-2:#F3FAF8; --il-sun:#FFF4E0; --il-far:#BCDDD5; --il-mid:#93CBBC; --il-near:#62B19C; --il-deep:#3E8F7B;
  --il-ink:#2C5E54; --il-ink-2:#3F786C; --il-water-1:#D7EFEA; --il-water-2:#9FD4C9; --il-line:#FFFFFF; --il-wall:#F2F8F6; --il-window:#E4F2EE;
  --il-warm:#EE9A73; --il-warm-2:#F7CDA5; --il-glow:#F7CDA5; --il-glow-o:.28;
  --r-card:16px; --r-thumb:10px; --r-pill:999px;
  --ease:cubic-bezier(.16,1,.3,1);
  --font:"HarmonyOS Sans SC","MiSans","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.75;
}
.yx[data-theme="dark"]{
  --bg:#0C1412; --surface:#121C1A; --surface-2:#182421; --surface-3:#1F2D29;
  --line:#25342F; --line-strong:#33453F;
  --text:#E4ECE9; --text-2:#B1BFBA; --text-3:#92A19C;
  --accent:#3FC2A5; --accent-hover:#5DD0B6; --accent-soft:#15302A; --accent-ink:#7EDDC6; --on-accent:#06211B;
  --warn:#E6B35C; --warn-soft:#2E2412;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.28);
  --shadow-lift:0 2px 6px rgba(0,0,0,.4),0 18px 40px rgba(0,0,0,.4);
  --focus:0 0 0 3px rgba(63,194,165,.35);
  --map-land:#141E1C; --map-park:#18291F; --map-water:#16303A; --map-water-ink:#6FA7B3; --map-block:#18221F;
  --map-road:#27332F; --map-road-case:#101816; --map-label:#8C9C97; --map-case:#0C1412;
  --il-sky-1:#1B433B; --il-sky-2:#0F201D; --il-sun:#E6F1ED; --il-far:#1F3E37; --il-mid:#28524A; --il-near:#306A5A; --il-deep:#3E826F;
  --il-ink:#0A1513; --il-ink-2:#122822; --il-water-1:#183B36; --il-water-2:#0D2320; --il-line:#6FAEA1; --il-wall:#2A3A35; --il-window:#F0C39A;
  --il-warm:#E0936C; --il-warm-2:#EFC29A; --il-glow:#A8E0D2; --il-glow-o:.12;
}
.yx [hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.ic{display:inline-block;flex:none;vertical-align:-0.18em}

/* ---------- 基础组件 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border:0;border-radius:var(--r-pill);background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:600;white-space:nowrap;cursor:pointer;transition:background-color .16s var(--ease),transform .16s var(--ease),box-shadow .16s var(--ease)}
.btn:hover{background:var(--accent-hover)}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.icon-btn:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:none;box-shadow:var(--focus)}
.btn.is-secondary{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-strong)}
.btn.is-secondary:hover{background:var(--surface-2)}
.btn.is-small{height:36px;padding:0 16px;font-size:14px}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border:0;border-radius:var(--r-pill);background:transparent;color:var(--text-2);cursor:pointer;transition:background-color .16s var(--ease),color .16s var(--ease),transform .16s var(--ease)}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.is-outline{box-shadow:inset 0 0 0 1px var(--line-strong);background:var(--surface)}
.icon-btn.is-on{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border:0;border-radius:var(--r-pill);background:var(--surface-2);color:var(--text-2);font-size:14px;white-space:nowrap;cursor:pointer;transition:background-color .16s var(--ease),color .16s var(--ease)}
.chip:hover{background:var(--surface-3);color:var(--text)}
.chip.is-outline{background:transparent;box-shadow:inset 0 0 0 1px var(--line-strong)}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:var(--r-pill);box-shadow:inset 0 0 0 1px var(--line-strong);color:var(--text-2);font-size:12px;white-space:nowrap}
.tag.is-accent{box-shadow:none;background:var(--accent-soft);color:var(--accent-ink)}
.status{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent-ink);font-size:13px;font-weight:600;white-space:nowrap}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:var(--r-pill);background:var(--surface-2)}
.tab{height:32px;padding:0 14px;border:0;border-radius:var(--r-pill);background:transparent;color:var(--text-2);font-size:14px;cursor:pointer;transition:background-color .16s var(--ease),color .16s var(--ease)}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.link{display:inline-flex;align-items:center;gap:6px;color:var(--accent-ink);font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap}
.link:hover{color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;color:var(--text-3);font-size:13px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.photo{position:relative;overflow:hidden;background:var(--surface-2)}
.photo>svg{width:100%;height:100%;transition:transform .48s var(--ease)}
.photo.is-link{display:block;cursor:pointer}
.photo.is-link:hover>svg{transform:scale(1.04)}
.photo.is-link:focus-visible{outline:none;box-shadow:var(--focus)}
.site-link{display:inline-flex;align-items:center;gap:2px;color:var(--accent-ink);font-weight:600;text-decoration:none;white-space:nowrap}
.site-link:hover{text-decoration:underline;text-underline-offset:3px}
.site-link:focus-visible{outline:none;box-shadow:var(--focus);border-radius:4px}

/* ---------- 统一画风插画（颜色全部取自令牌，深色模式自动换夜景） ---------- */
.il .s-sky1{stop-color:var(--il-sky-1)}.il .s-sky2{stop-color:var(--il-sky-2)}
.il .s-wat1{stop-color:var(--il-water-1)}.il .s-wat2{stop-color:var(--il-water-2)}
.il .f-sun{fill:var(--il-sun)}.il .f-glow{fill:var(--il-glow);opacity:var(--il-glow-o)}
.nw{white-space:nowrap}
.il .f-far{fill:var(--il-far)}.il .f-mid{fill:var(--il-mid)}.il .f-near{fill:var(--il-near)}.il .f-deep{fill:var(--il-deep)}
.il .f-ink{fill:var(--il-ink)}.il .f-ink2{fill:var(--il-ink-2)}.il .f-wall{fill:var(--il-wall)}.il .f-win{fill:var(--il-window)}
.il .f-warm{fill:var(--il-warm)}.il .f-warm2{fill:var(--il-warm-2)}
.il .s-line{fill:none;stroke:var(--il-line);stroke-linecap:round;opacity:.7}
.il .s-ink{fill:none;stroke:var(--il-ink);stroke-linecap:round}
.il .s-deep{fill:none;stroke:var(--il-deep);stroke-linecap:round}
.il .s-warm{fill:none;stroke:var(--il-warm);stroke-linecap:round}

/* ---------- 进场与反馈动效（仅在用户未要求减少动效时） ---------- */
@media (prefers-reduced-motion:no-preference){
  .yx [data-reveal]{opacity:0;transform:translateY(14px);transition:opacity .52s var(--ease),transform .52s var(--ease);transition-delay:calc(var(--i,0) * 70ms)}
  .yx [data-reveal].is-in{opacity:1;transform:none}
  .spin{animation:spin .9s linear infinite}
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 导航 ---------- */
.nav{position:relative;z-index:2;display:flex;align-items:center;gap:36px;height:68px;padding:0 48px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;letter-spacing:1px;color:var(--text);text-decoration:none}
.brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--on-accent)}
.nav-links{display:flex;gap:6px}
.nav-links a{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:var(--r-pill);color:var(--text-2);font-size:15px;text-decoration:none;transition:background-color .16s var(--ease),color .16s var(--ease)}
.nav-links a:hover{background:var(--surface-2);color:var(--text)}
.nav-links a[aria-current="page"]{color:var(--accent-ink);font-weight:600;background:var(--accent-soft)}
.nav-end{display:flex;align-items:center;gap:14px;margin-left:auto}
.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-size:14px;font-weight:700}
.nav-menu{display:none}

/* ---------- 首页 ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:0 48px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:56px;padding:56px 0 88px}
.hero>*{min-width:0}
.hero h1{margin:0;font-size:54px;line-height:1.16;font-weight:700;letter-spacing:.5px}
.hero-lead{max-width:23.5em;margin:20px 0 0;color:var(--text-2);font-size:17px;line-height:1.8;text-wrap:pretty}

.ask{display:flex;align-items:center;gap:6px;max-width:600px;height:64px;margin-top:36px;padding:0 8px 0 6px;border-radius:var(--r-pill);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line),var(--shadow)}
.ask-city{display:inline-flex;align-items:center;gap:4px;height:48px;padding:0 12px 0 16px;border:0;border-radius:var(--r-pill);background:transparent;color:var(--text);font-size:15px;font-weight:600;cursor:pointer}
.ask-city:hover{background:var(--surface-2)}
.ask-sep{width:1px;height:24px;background:var(--line)}
.ask-text{flex:1;min-width:0;padding:0 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--text);font-size:16px}
.ask .btn{height:48px}
.hero-chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.hero-media{position:relative;padding:0 0 40px 56px}
.hero-main{aspect-ratio:1/1.02;border-radius:var(--r-card)}
.hero-sub{position:absolute;left:0;bottom:0;width:46%;aspect-ratio:4/3;border-radius:var(--r-card);box-shadow:0 0 0 8px var(--bg),var(--shadow-lift)}

.section{padding:24px 0 96px}
.section-head{display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;margin-bottom:28px}
.section-head h2{margin:0;font-size:30px;line-height:1.3;font-weight:700}
.section-head .push{margin-left:auto}

.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:auto auto;gap:20px}
.poi{display:flex;flex-direction:column;overflow:hidden;border-radius:var(--r-card);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);transition:transform .24s var(--ease),box-shadow .24s var(--ease)}
.poi:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 1px var(--line),var(--shadow-lift)}
.poi:hover .photo>svg{transform:scale(1.04)}
.poi .photo{aspect-ratio:4/3}
.poi-body{display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px}
.poi-title{display:flex;align-items:center;justify-content:space-between;gap:8px}
.poi-title h3{margin:0;font-size:17px;line-height:1.4;font-weight:600}
.poi-actions{display:flex;align-items:center;gap:6px;margin-right:-8px}
.poi-actions .site-link{font-size:13px}
.poi-title .icon-btn{width:34px;height:34px}
.poi-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.poi.is-feature{grid-column:1 / 3;grid-row:1 / 3}
.poi.is-feature .photo{aspect-ratio:auto;flex:1;min-height:380px}
.poi.is-feature .poi-body{gap:10px;padding:20px 22px 22px}
.poi.is-feature h3{font-size:24px}
.poi-desc{margin:0;color:var(--text-2);font-size:15px}

.band{background:var(--surface-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.rail-wrap{padding:80px 0 88px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:360px;gap:24px;padding:4px 48px 12px max(48px,calc((100% - 1184px) / 2));margin:0;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:max(48px,calc((100% - 1184px) / 2));scrollbar-width:none;list-style:none}
.rail::-webkit-scrollbar{display:none}
.trip{scroll-snap-align:start}
.trip .photo{aspect-ratio:16/10;border-radius:var(--r-card)}
.trip:hover .photo>svg{transform:scale(1.04)}
.trip h3{margin:16px 0 6px;font-size:18px;line-height:1.4;font-weight:600}
.trip-route{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;color:var(--text-2);font-size:14px}
.trip-route .ic{color:var(--text-3)}
.trip .meta{margin-top:8px}

.how{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:center;gap:72px;padding:96px 0}
.how h2{margin:0;font-size:34px;line-height:1.35;font-weight:700}
.how-list{display:grid;gap:26px;margin:36px 0 36px;padding:0;list-style:none}
.how-list li{display:grid;grid-template-columns:48px 1fr;gap:16px;align-items:start}
.how-icon{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink)}
.how-list h3{margin:2px 0 2px;font-size:17px;font-weight:600}
.how-list p{margin:0;color:var(--text-2)}
.preview{padding:22px;border-radius:var(--r-card);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line),var(--shadow-lift)}
.preview-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.preview-head b{font-size:17px}

.footer{border-top:1px solid var(--line);background:var(--surface)}
.footer .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px;padding-top:28px;padding-bottom:28px}
.footer p{margin:0;color:var(--text-3);font-size:13px}
.footer nav{display:flex;gap:22px;margin-left:auto}
.footer nav a{color:var(--text-2);font-size:14px;text-decoration:none}
.footer nav a:hover{color:var(--text)}

/* ---------- AI 规划页 ---------- */
.plan-head{padding:22px 48px 18px}
.crumb{color:var(--text-3);font-size:13px}
.plan-title{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-top:4px}
.plan-title h1{margin:0;font-size:30px;line-height:1.3;font-weight:700}
.plan-actions{display:flex;gap:10px;margin-left:auto}
.constraints{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.constraints .chip{height:32px;font-size:13px}
.plan{display:grid;grid-template-columns:340px 420px minmax(0,1fr);align-items:start;gap:24px;padding:4px 48px 48px}
.panel{border-radius:var(--r-card);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.chat{display:flex;flex-direction:column;gap:14px;padding:16px}
.chat-head{display:flex;align-items:center;gap:8px;font-weight:600}
.chat-head .icon-btn{margin-left:auto;width:34px;height:34px}
.bubble-user{align-self:flex-end;max-width:92%;padding:11px 14px;border-radius:16px 16px 4px 16px;background:var(--accent);color:var(--on-accent);font-size:14px;line-height:1.7}
.steps{display:grid;gap:2px;margin:0;padding:8px;border-radius:var(--r-thumb);background:var(--surface-2);list-style:none}
.step{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:7px 6px;font-size:13px;line-height:1.55}
.step-icon{display:grid;place-items:center;width:22px;height:22px;color:var(--text-3)}
.step[data-state="done"] .step-icon{color:var(--accent)}
.step[data-state="running"] .step-icon{color:var(--accent)}
.step b{display:block;font-size:14px;font-weight:600;color:var(--text)}
.step[data-state="pending"] b{color:var(--text-3);font-weight:500}
.step small{display:block;color:var(--text-3);font-size:12.5px}
.bubble-ai{padding:11px 14px;border-radius:16px 16px 16px 4px;background:var(--surface-2);font-size:14px;line-height:1.8}
.chat-sugs{display:flex;flex-wrap:wrap;gap:8px}
.chat-sugs .chip{height:32px;font-size:13px}
.chat-input{display:flex;align-items:center;gap:8px;height:48px;padding:0 6px 0 16px;border-radius:var(--r-pill);box-shadow:inset 0 0 0 1px var(--line-strong);color:var(--text-3);font-size:14px}
.chat-input .icon-btn{margin-left:auto;width:36px;height:36px;background:var(--accent);color:var(--on-accent)}
.chat-input .icon-btn:hover{background:var(--accent-hover);color:var(--on-accent)}

.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:14px 18px}
.summary span{display:block;color:var(--text-3);font-size:12.5px}
.summary b{display:block;font-size:19px;line-height:1.4;font-weight:700}
.summary small{display:block;color:var(--accent-ink);font-size:12px}
.timeline{margin:10px 0 0;padding:0;list-style:none}
.stop{position:relative;display:grid;grid-template-columns:52px 26px minmax(0,1fr);gap:0 12px;padding:10px 10px 10px 8px;border-radius:var(--r-card);cursor:default;transition:background-color .16s var(--ease)}
.stop:hover,.stop.is-hot{background:var(--surface)}
.stop-time{padding-top:3px;font-size:15px;font-weight:700;line-height:1.3}
.stop-time small{display:block;color:var(--text-3);font-size:12px;font-weight:400}
.stop-rail{position:relative;display:flex;justify-content:center}
.stop-rail::before{content:"";position:absolute;top:-10px;bottom:-10px;left:50%;width:2px;margin-left:-1px;background:var(--line)}
.timeline li:first-child .stop-rail::before{top:14px}
.timeline li:last-child .stop-rail::before{bottom:calc(100% - 14px)}

<script>

/* ---------- 示意数据 ---------- */

/* ---------- 统一画风插画库（扁平风，颜色全部走 CSS 令牌；带 a-* 类的部件在悬停时会动） ---------- */
let ILID = 0;
function il(kind) {
  const id = 'il' + (++ILID);
  const vb = kind === 'heroMain' ? '0 0 600 600' : '0 0 400 300';
  return `<svg class="il" viewBox="${vb}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>
    <linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s-sky1"/><stop offset="1" class="s-sky2"/></linearGradient>
    <linearGradient id="${id}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s-wat1"/><stop offset="1" class="s-wat2"/></linearGradient>
  </defs>${SCENES[kind](id)}</svg>`;
}
const SKY = (id, w = 400, h = 300) => `<rect width="${w}" height="${h}" fill="url(#${id}s)"/>`;
const WATER = (id, y, w = 400, h = 300) => `<rect y="${y}" width="${w}" height="${h - y}" fill="url(#${id}w)"/>`;
const SUN = (x, y, r) => `<g class="a-sun"><circle class="f-glow" cx="${x}" cy="${y}" r="${r * 1.8}"/><circle class="f-sun" cx="${x}" cy="${y}" r="${r}"/></g>`;
const RIP = d => `<path class="s-line a-ripple" stroke-width="1.6" d="${d}"/>`;
const STEAM = d => `<path class="s-line a-steam" stroke-width="2" d="${d}"/>`;
const BIRDS = (x, y) => `<path class="s-ink a-birds" stroke-width="1.8" d="M${x} ${y}q6-5 12 0q6-5 12 0M${x + 30} ${y + 14}q4-4 8 0q4-4 8 0"/>`;
const FAR = '<path class="f-far" d="M0 150C40 122 84 112 124 128C164 144 196 100 244 112C292 124 324 96 364 110C382 116 394 122 400 126V230H0Z"/>';
const MID = '<path class="f-mid" d="M0 178C52 152 92 158 132 168C182 180 214 150 262 160C312 170 352 156 400 166V230H0Z"/>';
const TREES = (x, y, s = 1, cls = 'f-deep') =>
  `<g class="${cls}" transform="translate(${x} ${y}) scale(${s})"><circle cx="0" cy="-14" r="14"/><circle cx="14" cy="-10" r="11"/><circle cx="-13" cy="-9" r="10"/><rect x="-3" y="-4" width="6" height="10"/></g>`;
function ROOF(cx, y, w, h, cls) {
  const l = cx - w / 2, r = cx + w / 2;
  return `<path class="${cls}" d="M${l} ${y}Q${l + w * .12} ${y - 2} ${l + w * .18} ${y - h * .45}L${cx - w * .22} ${y - h}H${cx + w * .22}L${r - w * .18} ${y - h * .45}Q${r - w * .12} ${y - 2} ${r} ${y}Q${cx} ${y - h * .28} ${l} ${y}Z"/>`;
}
function PAGODA(cx, base, s) {
  let g = `<g transform="translate(${cx} ${base}) scale(${s})">`, y = 0;
  [[44, 19], [38, 17], [32, 16], [26, 15], [20, 14]].forEach(([w, h]) => {
    const top = y - h;
    g += `<rect class="f-ink" x="${-w / 2}" y="${top + 5}" width="${w}" height="${h - 5}"/>`;
    g += `<rect class="f-win" x="-3" y="${top + 8}" width="6" height="${h - 11}" rx="1"/>`;
    g += `<path class="f-ink" d="M${-w / 2 - 11} ${top + 7}Q${-w / 2 - 4} ${top + 4} ${-w / 2 + 2} ${top}H${w / 2 - 2}Q${w / 2 + 4} ${top + 4} ${w / 2 + 11} ${top + 7}Z"/>`;
    y = top;
  });
  return g + `<rect class="f-ink" x="-1.5" y="${y - 18}" width="3" height="18"/><circle class="f-warm2" cx="0" cy="${y - 20}" r="3.5"/></g>`;
}
function WILLOW(x, y, s = 1) {
  let g = `<g transform="translate(${x} ${y}) scale(${s})"><g class="a-tree"><path class="s-ink" stroke-width="4" d="M0 0C-3-26 4-52 0-84"/><ellipse class="f-near" cx="0" cy="-86" rx="36" ry="15"/>`;
  [-40, -28, -16, -4, 8, 20, 32, 44].forEach((dx, i) => {
    g += `<path class="s-deep" stroke-width="2" d="M${dx * .25} -88C${dx * .6} -86 ${dx} -66 ${dx * 1.05} ${-18 - (i % 3) * 10}"/>`;
  });
  return g + '</g></g>';
}
const PEACH = (x, y, s = 1) =>
  `<g transform="translate(${x} ${y}) scale(${s})"><g class="a-bloom"><path class="s-ink" stroke-width="3" d="M0 0V-26M0-14l-9-9M0-18l8-8"/><g class="f-warm2"><circle cx="-10" cy="-30" r="9"/><circle cx="4" cy="-36" r="10"/><circle cx="12" cy="-26" r="8"/><circle cx="-2" cy="-24" r="7"/></g></g></g>`;

  `<g transform="translate(${x} ${y}) scale(${s})"><g class="a-boat"><path class="f-ink2" d="M-42 0Q0 16 42 0L36-6H-36Z"/><path class="f-ink" d="M-18-6V-22Q0-34 18-22V-6Z"/><circle class="f-ink" cx="28" cy="-20" r="4"/><path class="f-ink" d="M25-16h6l2 10h-10Z"/><path class="s-ink" stroke-width="2" d="M30-10L50 10"/><path class="s-line" stroke-width="1.6" d="M-36 8h72"/></g></g>`;
function LEAF(x, y, r, cls) {
  const p1 = [x + r * .985, y - r * .174], p2 = [x + r * .766, y - r * .643];
  return `<path class="${cls}" d="M${x} ${y}L${p1[0].toFixed(1)} ${p1[1].toFixed(1)}A${r} ${r} 0 1 1 ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}Z"/>`;

  let d = '';

/* ---------- 公共片段 ---------- */
function nav(active) {
  const links = [['home', '首页'], ['poi', '景点'], ['plan', '行程规划'], ['note', '游记']];
  return `<header class="nav">
    <a class="brand" href="#"><span class="brand-mark">${I('path', 18)}</span>悠行</a>
    <nav class="nav-links" aria-label="主导航">${links.map(([k, t]) => `<a href="#"${k === active ? ' aria-current="page"' : ''}>${t}</a>`).join('')}<span class="nav-line" aria-hidden="true"></span></nav>
    <div class="nav-end"><a class="link" href="#">我的行程</a><span class="avatar" aria-label="当前用户">林</span>
      <button class="icon-btn nav-menu" type="button" aria-label="菜单">${I('list', 22)}</button></div>
  </header>`;
}
const footer = () => `<footer class="footer"><div class="wrap">
  <a class="brand" href="#"><span class="brand-mark">${I('path', 18)}</span>悠行</a>
  <p>毕业设计示意页面，景点信息与插画仅作演示</p>
  <nav aria-label="页脚"><a href="#">关于我们</a><a href="#">帮助中心</a><a href="#">隐私政策</a></nav>
</div></footer>`;

const stepIcon = {pending: 'circle', running: 'circle-notch', done: 'check-circle-fill'};
const stepRow = (s, st) => `<li class="step" data-state="${st}"><span class="step-icon">${I(stepIcon[st], 20, st === 'running' ? 'spin' : '')}</span><div><b>${s.title}</b><small>${s.detail}</small></div></li>`;
const timelineItem = it => it.leg
  ? `<li class="leg"><span></span><span class="leg-rail"></span><span class="leg-text">${I(it.leg === 'walk' ? 'person-simple-walk' : 'taxi', 15)}${it.text}</span></li>`
  : `<li class="stop" data-stop="${it.no}">
      <div class="stop-time num">${it.time}<small>${it.end}</small></div>
      <div class="stop-rail"><span class="stop-no">${it.no}</span></div>
      <div class="stop-body">${art(it.img, it.name + '插画', '', it.site)}<div><h3>${it.name}</h3><p>${it.desc}</p>
        <div class="meta num">${it.meta.map(([ic, tx]) => `<span>${I(ic, 14)}${tx}</span>`).join('')}${siteLink(it.site)}</div></div></div>
    </li>`;

/* ---------- 首页 ---------- */
function poiCard(p, i) {
  const feature = i === 0;
  return `<article class="poi${feature ? ' is-feature' : ''}" data-reveal style="--i:${i}">
    <span class="spot" aria-hidden="true"></span>
    ${art(p.img, p.name + '插画', '', p.site)}
    <div class="poi-body">
      <div class="poi-title"><h3>${p.name}</h3><div class="poi-actions">${siteLink(p.site)}<button class="icon-btn" type="button" data-fav aria-pressed="false" aria-label="收藏 ${p.name}">${I('heart', 20)}</button></div></div>
      ${feature ? `<p class="poi-desc">${p.desc}</p><div class="demo-row" style="margin:0">${[p.tag, ...p.tags].map((t, k) => `<span class="tag${k === 0 ? ' is-accent' : ''}">${t}</span>`).join('')}</div>` : ''}
      <div class="poi-foot">
        <div class="meta num"><span>${I('star-fill', 14)}${p.rating}</span><span>${I('clock', 14)}${p.dur}</span></div>
        ${feature ? `<button class="btn is-small is-secondary" type="button">${I('plus', 16)}加入行程</button>` : `<span class="tag">${p.tag}</span>`}
      </div>
    </div>
  </article>`;
}
const tripCard = (t, i) => `<li class="trip" data-reveal style="--i:${i}">
  ${art(t.img, t.title + '插画')}

</li>`;
function miniPlan() {
  const T = DATA.trip;
  return `<div class="preview-head" data-how="need"><b>${T.title}</b><span class="status">${I('check-circle-fill', 16)}已校验</span></div>
    <ol class="steps" data-how="plan">${DATA.steps.slice(1).map(s => stepRow(s, 'done')).join('')}</ol>

}

        `<g class="m-tip" transform="translate(${x} ${y - 18})"><g class="m-tip-in"><rect x="${-w / 2}" y="-26" width="${w}" height="24" rx="12"/><text x="0" y="-14" text-anchor="middle" dominant-baseline="central">${label}</text></g></g></g>`;
    }).join('')}
  </svg>`;
}

/* ---------- 预览切换与交互 ---------- */
const stage = document.getElementById('stage');
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
const state = {page: 'home', device: 'desktop', theme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'};
let agentTimers = [];
let mapObserver = null;

function readHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  if (['home', 'plan', 'spec'].includes(q.get('page'))) state.page = q.get('page');
  if (['desktop', 'mobile'].includes(q.get('device'))) state.device = q.get('device');
  if (['light', 'dark'].includes(q.get('theme'))) state.theme = q.get('theme');
  state.live = q.get('live') === '1';
}
function writeHash() {
  const h = `page=${state.page}&device=${state.device}&theme=${state.theme}`;
  if (location.hash.slice(1) !== h) history.replaceState(null, '', '#' + h);
}
function setupReveal() {
  const els = stage.querySelectorAll('[data-reveal]');
  if (state.live || reduce.matches || !('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('is-in')); return; }
  const io = new IntersectionObserver(entries => entries.forEach(en => {
    if (en.isIntersecting) { en.target.classList.add('is-in'); io.unobserve(en.target); }
  }), {threshold: 0.12});
  els.forEach(e => io.observe(e));
}
function setupMap() {
  if (mapObserver) { mapObserver.disconnect(); mapObserver = null; }
  const box = stage.querySelector('.mapbox');
  if (!box) return;
  const svg = box.querySelector('svg');
  const fit = () => {
    const W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    const s = Math.min(1.25, H / 300, W / 320), w = W / s, h = H / s;
    svg.setAttribute('viewBox', `${(190 - w / 2).toFixed(1)} ${(405 - h / 2).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);
  };
  fit();
  if ('ResizeObserver' in window) { mapObserver = new ResizeObserver(fit); mapObserver.observe(box); }
}
function setStep(el, st) {
  el.dataset.state = st;
  el.querySelector('.step-icon').innerHTML = I(stepIcon[st], 20, st === 'running' ? 'spin' : '');
}
function runAgent(animate) {
  agentTimers.forEach(clearTimeout);
  agentTimers = [];
  const steps = [...stage.querySelectorAll('#steps .step')];
  if (!steps.length) return;
  const reply = stage.querySelector('#reply'), sugs = stage.querySelector('#sugs');
  const items = [...stage.querySelectorAll('#timeline > li')];
  const routes = [...stage.querySelectorAll('.m-route-draw')];
  const markers = [...stage.querySelectorAll('.m-marker')];
  routes.forEach(p => p.style.setProperty('--len', p.getTotalLength().toFixed(1)));
  const showAll = () => {
    steps.forEach(s => setStep(s, 'done'));
    reply.hidden = false; sugs.hidden = false;
    items.forEach(s => { s.style.opacity = ''; s.style.transform = ''; });
    routes.forEach(r => r.classList.add('is-in'));
    markers.forEach(m => { m.style.opacity = ''; });
  };
  if (!animate || reduce.matches) { showAll(); return; }
  steps.forEach(s => setStep(s, 'pending'));
  reply.hidden = true; sugs.hidden = true;
  items.forEach(s => { s.style.transition = 'none'; s.style.opacity = '0'; s.style.transform = 'translateY(8px)'; });
  routes.forEach(r => r.classList.remove('is-in'));
  markers.forEach(m => { m.style.transition = 'none'; m.style.opacity = '0'; });
  const gap = 520;
  steps.forEach((s, i) => agentTimers.push(setTimeout(() => {
    if (i) setStep(steps[i - 1], 'done');
    setStep(s, 'running');
  }, 200 + i * gap)));
  agentTimers.push(setTimeout(() => {
    setStep(steps[steps.length - 1], 'done');
    reply.hidden = false; sugs.hidden = false;
    items.forEach((s, i) => agentTimers.push(setTimeout(() => {
      s.style.transition = 'opacity .45s var(--ease), transform .45s var(--ease)';
      s.style.opacity = ''; s.style.transform = '';
    }, i * 60)));
    routes.forEach(r => { r.getBoundingClientRect(); r.classList.add('is-in'); });
    markers.forEach((m, i) => agentTimers.push(setTimeout(() => {
      m.style.transition = 'opacity .3s var(--ease)'; m.style.opacity = '';
    }, 300 + i * 120)));
  }, 200 + steps.length * gap));
}
/* 悬停微交互 */
const pop = el => { if (!el) return; el.classList.remove('is-pop'); void el.offsetWidth; el.classList.add('is-pop'); };
let frameReq = 0, frameFn = null;
const nextFrame = fn => {
  frameFn = fn;
  if (!frameReq) frameReq = requestAnimationFrame(() => { frameReq = 0; const f = frameFn; frameFn = null; if (f) f(); });
};
function setupNavLine() {
  const nav = stage.querySelector('.nav-links');
  if (!nav) return;
  const line = nav.querySelector('.nav-line');
  const move = a => {
    if (!a) { line.style.opacity = '0'; return; }
    line.style.opacity = '1';
    line.style.transform = `translateX(${a.offsetLeft + 12}px) scaleX(${((a.offsetWidth - 24) / 100).toFixed(3)})`;
  };
  nav.querySelectorAll('a').forEach(a => a.addEventListener('mouseenter', () => move(a)));
  nav.addEventListener('mouseleave', () => move(null));
}
function setupHeroChips() {
  const text = stage.querySelector('.ask-text'), chips = stage.querySelector('.hero-chips'), media = stage.querySelector('.hero-media');
  if (media) media.addEventListener('pointerleave', () => { media.style.setProperty('--px', 0); media.style.setProperty('--py', 0); });
  if (!text || !chips) return;
  let current = DATA.heroPrompt, timer = 0;
  const show = t => {
    if (text.firstChild.nodeValue === t) return;
    clearTimeout(timer);
    text.classList.add('is-swap');
    timer = setTimeout(() => { text.firstChild.nodeValue = t; text.classList.remove('is-swap'); }, reduce.matches ? 0 : 160);
  };
  chips.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('mouseenter', () => show(c.textContent));
    c.addEventListener('click', () => { current = c.textContent; show(current); });
  });
  chips.addEventListener('mouseleave', () => show(current));
}
function setupHow() {
  const pv = stage.querySelector('.preview');
  if (!pv) return;
  stage.querySelectorAll('.how-list li[data-how]').forEach(li => {
    li.addEventListener('mouseenter', () => { pv.classList.remove('is-need', 'is-plan', 'is-book'); pv.classList.add('is-' + li.dataset.how); });
    li.addEventListener('mouseleave', () => pv.classList.remove('is-' + li.dataset.how));
  });
}
stage.addEventListener('pointermove', e => {
  if (reduce.matches || e.pointerType === 'touch') return;
  const media = e.target.closest('.hero-media'), card = e.target.closest('.poi');
  if (!media && !card) return;
  const x = e.clientX, y = e.clientY;
  nextFrame(() => {
    if (media) {
      const r = media.getBoundingClientRect();
      media.style.setProperty('--px', ((x - r.left) / r.width * 2 - 1).toFixed(3));
      media.style.setProperty('--py', ((y - r.top) / r.height * 2 - 1).toFixed(3));
    }
    if (card) {
      const r = card.getBoundingClientRect();
      card.querySelector('.spot').style.transform = `translate(${Math.round(x - r.left - 140)}px, ${Math.round(y - r.top - 140)}px)`;
    }
  });
});

function render() {
  writeHash();
  document.querySelectorAll('[data-page]').forEach(b => b.setAttribute('aria-pressed', b.dataset.page === state.page));
  document.querySelectorAll('[data-device]').forEach(b => b.setAttribute('aria-pressed', b.dataset.device === state.device));
  document.querySelectorAll('[data-theme-btn]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeBtn === state.theme));
  agentTimers.forEach(clearTimeout);
  const body = state.page === 'home' ? home() : state.page === 'plan' ? plan() : spec();
  stage.innerHTML = `<div class="frame${state.device === 'mobile' ? ' is-mobile' : ''}"><div class="yx${state.live ? ' is-live' : ''}" data-theme="${state.theme}">${body}</div></div>`;
  setupReveal();
  setupMap();
  setupNavLine();
  setupHeroChips();
  setupHow();
  runAgent(state.page === 'plan' && !state.live);
  if (state.live) {
    stage.querySelectorAll('[data-stop="3"]').forEach(x => { x.classList.add('is-hot'); if (x.classList.contains('m-marker')) x.parentNode.appendChild(x); });
    const pv = stage.querySelector('.preview');
    if (pv) pv.classList.add('is-plan');
  }
}
function setTheme(t) {
  state.theme = t;
  const root = stage.querySelector('.yx');
  if (root) { root.dataset.theme = t; writeHash(); document.querySelectorAll('[data-theme-btn]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeBtn === t)); }
}
document.addEventListener('click', e => {
  const t = e.target.closest('button,a');
  if (!t) return;
  if (t.tagName === 'A' && t.getAttribute('href') === '#') e.preventDefault();
  if (t.dataset.page) { state.page = t.dataset.page; render(); return; }
  if (t.dataset.device) { state.device = t.dataset.device; render(); return; }
  if (t.dataset.themeBtn) { setTheme(t.dataset.themeBtn); return; }
  if (t.dataset.go) { state.page = t.dataset.go; render(); window.scrollTo(0, 0); return; }
  if (t.hasAttribute('data-replay')) { runAgent(true); return; }
  if (t.hasAttribute('data-fav')) {
    const on = t.getAttribute('aria-pressed') !== 'true';
    t.setAttribute('aria-pressed', on); t.classList.toggle('is-on', on); t.innerHTML = I(on ? 'heart-fill' : 'heart', 20);
    pop(t);
    return;
  }
  if (t.hasAttribute('data-save')) {
    const on = !t.classList.contains('is-saved');
    t.classList.toggle('is-saved', on);
    t.innerHTML = `${I(on ? 'bookmark-simple-fill' : 'bookmark-simple', 18)}${on ? '已保存' : '保存行程'}`;
    pop(t);
    return;
  }
  if (t.closest('.chat-sugs')) {
    const box = stage.querySelector('.chat-input');
    box.querySelector('.chat-input-text').textContent = t.textContent;
    box.classList.add('has-text');
    pop(box.querySelector('.icon-btn'));
    return;
  }
  if (t.dataset.rail) {
    const rail = stage.querySelector('#rail');
    rail.scrollBy({left: Number(t.dataset.rail) * 384, behavior: reduce.matches ? 'auto' : 'smooth'});
    return;
  }
  if (t.classList.contains('tab')) {
    t.parentElement.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === t));
  }
});
stage.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-stop]');
  stage.querySelectorAll('[data-stop].is-hot').forEach(x => { if (!el || x.dataset.stop !== el.dataset.stop) x.classList.remove('is-hot'); });
  if (el) stage.querySelectorAll(`[data-stop="${el.dataset.stop}"]`).forEach(x => {
    x.classList.add('is-hot');
    if (x.classList.contains('m-marker') && x.parentNode.lastElementChild !== x) x.parentNode.appendChild(x);
  });
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'h') state.page = 'home';
  else if (k === 'p') state.page = 'plan';
  else if (k === 's') state.page = 'spec';
  else if (k === 'm') state.device = state.device === 'mobile' ? 'desktop' : 'mobile';
  else if (k === 'd') { setTheme(state.theme === 'dark' ? 'light' : 'dark'); return; }
  else return;
  render();
});
window.addEventListener('hashchange', () => { readHash(); render(); });
