# 部署模式的 nginx 配置：提供前端打包好的页面，把 /api 反向代理给后端。
#
#   浏览器 ──► nginx（770）──┬─ 页面：tour-web/dist 里的静态文件
#                            └─ /api：转给后端（Spring Boot，777）──► AI 服务（7777）
#
# 由 deploy.bat 在 deploy/nginx 目录里启动：nginx.exe -c ../nginx.conf
# Windows 版 nginx 把启动目录当作根目录，所以下面的 root、日志等相对路径都相对于 deploy/nginx；
# include 相对于本文件所在的 deploy 目录。

worker_processes  1;
error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       nginx/conf/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    access_log    logs/access.log;

    # 压缩文本类的文件，页面加载更快
    gzip        on;
    gzip_types  text/css application/javascript application/json image/svg+xml;

    server {
        listen       770;
        server_name  localhost;

        # 前端打包后的文件（在 tour-web 目录运行 npm run build 生成）
        root   ../../tour-web/dist;
        index  index.html;

        # /chat、/trips/1 这类前端路由，刷新页面时也返回 index.html，交给 React 处理
        location / {
            try_files $uri $uri/ /index.html;
        }

        # index.html 不缓存，重新部署后浏览器能马上拿到新页面
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # 打包后的 js、css 文件名带内容哈希，内容一变文件名就变，可以放心缓存
        location /assets/ {
            expires 30d;
        }

        # 接口转给后端
        location /api/ {
            proxy_pass http://127.0.0.1:777;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 小萧规划一次最多要等一分钟左右（后端等 AI 服务 60 秒），这里多留一点
            proxy_read_timeout 75s;
        }
    }
}
